<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1">

    <title>Notifications</title>


    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Custom CSS -->
    <link
        rel="stylesheet"
        href="../css/style.css">

</head>


<body>


    <!-- ================================= -->
    <!-- MAIN CONTENT -->
    <!-- ================================= -->

    <div class="container py-5">


        <!-- Dashboard Link -->

        <a href="deshboard.html">← Dashboard</a>


        <h2 class="mt-3">

            🔔 Notifications

        </h2>


        <p class="text-muted">

            Your latest Campus Lost & Found updates.

        </p>


        <!-- ================================= -->
        <!-- Notifications Container -->
        <!-- ================================= -->

        <div
            id="notificationsContainer"
            class="mt-4">

            <div class="text-muted">

                Loading notifications...

            </div>

        </div>


    </div>



    <!-- ================================= -->
    <!-- JAVASCRIPT -->
    <!-- ================================= -->

    <script src="../js/main.js"></script>

<script>


        // ==========================================
        // API URL
        // ==========================================

        const API_URL =
            "http://localhost:5000/api";



        // ==========================================
        // LOAD NOTIFICATIONS
        // ==========================================

        async function loadNotifications() {


            const container =
                document.getElementById(
                    "notificationsContainer"
                );


            try {


                console.log(
                    "Loading notifications..."
                );


                // =================================
                // GET CLAIMS
                // =================================

                const response =
                    await fetch(
                        API_URL + "/claims/mine",
                        { headers: authHeaders() }
                    );


                if (!response.ok) {

                    throw new Error(
                        "Failed to load claims"
                    );

                }


                const claims =
                    await response.json();


                console.log(
                    "Claims received:",
                    claims
                );



                // =================================
                // NO CLAIMS
                // =================================

                if (
                    !Array.isArray(claims) ||
                    claims.length === 0
                ) {

                    container.innerHTML = `

                        <div class="alert alert-info">

                            🔔 No notifications yet.

                        </div>

                    `;

                    return;

                }



                // =================================
                // CLEAR CONTAINER
                // =================================

                container.innerHTML = "";



                // =================================
                // CREATE NOTIFICATIONS
                // =================================

                claims.forEach(function (claim) {


                    // -----------------------------
                    // Item information
                    // -----------------------------

                    let itemTitle =
                        "your reported item";


                    if (
                        claim.item &&
                        claim.item.title
                    ) {

                        itemTitle =
                            claim.item.title;

                    }



                    // -----------------------------
                    // Claim status
                    // -----------------------------

                    const status =
                        String(
                            claim.status || "Pending"
                        ).toLowerCase();



                    // -----------------------------
                    // Create notification
                    // -----------------------------

                    const notification =
                        document.createElement(
                            "div"
                        );


                    notification.className =
                        "alert mt-3";



                    // =================================
                    // APPROVED
                    // =================================

                    if (
                        status === "approved" ||
                        status === "verified"
                    ) {

                        notification.classList.add(
                            "alert-success"
                        );


                        notification.innerHTML = `

                            <strong>
                                ✓ Claim Approved
                            </strong>

                            <br>

                            Your claim for
                            <strong>
                                ${escapeHtml(itemTitle)}
                            </strong>
                            has been approved.

                        `;

                    }



                    // =================================
                    // REJECTED
                    // =================================

                    else if (
                        status === "rejected"
                    ) {

                        notification.classList.add(
                            "alert-danger"
                        );


                        notification.innerHTML = `

                            <strong>
                                ✕ Claim Rejected
                            </strong>

                            <br>

                            Your claim for
                            <strong>
                                ${escapeHtml(itemTitle)}
                            </strong>
                            was rejected.

                        `;

                    }



                    // =================================
                    // PENDING
                    // =================================

                    else {

                        notification.classList.add(
                            "alert-info"
                        );


                        notification.innerHTML = `

                            <strong>
                                🔔 Claim Submitted
                            </strong>

                            <br>

                            Your claim for
                            <strong>
                                ${escapeHtml(itemTitle)}
                            </strong>
                            is waiting for admin review.

                        `;

                    }



                    // =================================
                    // ADD DATE IF AVAILABLE
                    // =================================

                    if (
                        claim.createdAt
                    ) {

                        const date =
                            new Date(
                                claim.createdAt
                            );


                        if (
                            !isNaN(
                                date.getTime()
                            )
                        ) {

                            notification.innerHTML += `

                                <div class="small text-muted mt-2">

                                    ${date.toLocaleString()}

                                </div>

                            `;

                        }

                    }



                    // Add to page

                    container.appendChild(
                        notification
                    );

                });


            }

            catch (error) {


                console.error(
                    "Notification error:",
                    error
                );


                container.innerHTML = `

                    <div class="alert alert-danger">

                        Unable to load notifications.

                        <br>

                        Please make sure the backend
                        server is running.

                    </div>

                `;

            }

        }



        // ==========================================
        // ESCAPE HTML
        // ==========================================

        function escapeHtml(value) {

            const div =
                document.createElement("div");


            div.textContent =
                value;


            return div.innerHTML;

        }



        // ==========================================
        // LOAD WHEN PAGE OPENS
        // ==========================================

        loadNotifications();


    </script>


    <!-- Bootstrap JS -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


</body>

</html>
