<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Report Found Item</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <nav class="navbar navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="deshboard.html">
                🎓 CampusFind
            </a>
        </div>
    </nav>

    <div class="container">
        <div class="form-card">

            <h2>🟢 Report Found Item</h2>

            <form onsubmit="submitFoundItem(event, this)">

            <label>Item Name</label>
            <input class="form-control mb-3" id="title" required>

            <label>Category</label>
            <select class="form-select mb-3" id="category" required>
                <option>Electronics</option>
                <option>Documents</option>
                <option>Books</option>
                <option>Accessories</option>
                <option>Others</option>
            </select>

            <label>Description</label>
            <textarea class="form-control mb-3" id="description" rows="4" required></textarea>

            <label>Found Location</label>
            <input class="form-control mb-3" id="location" required>

            <label>Date Found</label>
            <input type="date" class="form-control mb-3" id="date" required>
            <label>Contact Email</label>
            <input type="email" class="form-control mb-3" id="contact" placeholder="student@example.com" required>

            <label>Upload Image</label>
            <input type="file" class="form-control mb-3" accept="image/*">

            <button class="btn btn-success w-100">
                Submit Found Report
            </button>

            </form>

        </div>
    </div>

    <script src="../js/main.js"></script>

</body>

</html>
