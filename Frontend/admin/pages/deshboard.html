<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>User Dashboard</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="row g-0">
    <!-- Sidebar -->
    <aside class="col-md-3 sidebar">
      <h4>🎓 CampusFind</h4>
      <hr>
      <a href="deshboard.html">🏠 Dashboard</a>
      <a href="items.html">🔍 Browse Items</a>
      <a href="report-lost.html">🔴 Report Lost</a>
      <a href="report-found.html">🟢 Report Found</a>
      <a href="my-reports.html">📋 My Reports</a>
      <a href="my-claims.html">🛡️ My Claims</a>
      <a href="notifications.html">🔔 Notifications</a>
      <a href="profile.html">👤 Profile</a>
      <a href="#" onclick="logout(); return false;">↩ Logout</a>
    </aside>

    <!-- Main Dashboard -->
    <main class="col-md-9 dashboard-main">
      <h2>Welcome, <span id="studentName">Student</span> 👋</h2>
      <p class="text-muted">Your CampusFind dashboard</p>

      <!-- Stats Section -->
      <div class="row g-3 my-3">
        <div class="col-md-4">
          <div class="stat-card">
            <h2 id="myReportsCount">0</h2>
            <p>My Reports</p>
          </div>
        </div>
        <div class="col-md-4">
          <div class="stat-card">
            <h2 id="myClaimsCount">0</h2>
            <p>My Claims</p>
          </div>
        </div>
        <div class="col-md-4">
          <div class="stat-card">
            <h2 id="notificationCount">0</h2>
            <p>Notifications</p>
          </div>
        </div>
      </div>

      <!-- Quick Actions -->
      <div class="panel mt-4">
        <h4>Quick Actions</h4>
        <a class="btn btn-primary me-2" href="report-lost.html">Report Lost</a>
        <a class="btn btn-success" href="report-found.html">Report Found</a>
      </div>
    </main>
  </div>
    <script src="../js/main.js"></script>

  <script>
    if (protectStudentPage()) {
      loadStudentDashboardStats();
    }
  </script>
</body>
</html>
