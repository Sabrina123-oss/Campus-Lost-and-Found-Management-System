<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Item Details</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
 <link rel="stylesheet" href="../css/style.css">
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="../index.html">🎓 CampusFind</a>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container py-5">

    <div class="form-card">

      <!-- Item Image -->
      <div class="item-image rounded mb-4">📦</div>

      <!-- Item Details -->
      <span id="itemType" class="badge"></span>

      <h2 id="itemTitle" class="mt-2">Loading...</h2>

      <p id="itemDescription"></p>

      <p id="itemLocation"></p>

      <p id="itemDate"></p>

      <p id="itemContact"></p>
      <!-- Buttons -->
      <button id="claimButton" class="btn btn-primary" style="display: none;">
        Claim This Item
      </button>

      <button id="editButton" class="btn btn-warning ms-2" style="display: none;">
        Edit Item
      </button>

      <button id="deleteButton" class="btn btn-danger ms-2" style="display: none;">
        Delete Item
      </button>

      <!-- Edit Form -->
      <div id="editForm" class="form-card mt-4" style="display: none;">

        <h3>Edit Item</h3>

        <form id="updateItemForm">

          <div class="mb-3">
            <label class="form-label">Title</label>
            <input type="text" id="editTitle" class="form-control" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea id="editDescription" class="form-control" required></textarea>
          </div>

          <div class="mb-3">
            <label class="form-label">Location</label>
            <input type="text" id="editLocation" class="form-control" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Contact</label>
            <input type="text" id="editContact" class="form-control" required>
          </div>

          <button type="submit" class="btn btn-success">
            Save Changes
          </button>

          <button type="button" id="cancelEdit" class="btn btn-secondary ms-2">
            Cancel
          </button>

        </form>

      </div>

    </div>

    <script src="../js/main.js"></script>

    <script>
      let currentItem = null;

      async function loadItemDetails() {

        const params = new URLSearchParams(window.location.search);
        const id = params.get("id");

        if (!id) {
          document.getElementById("itemTitle").textContent =
            "Item ID not found";
          return;
        }

        try {

          const response = await fetch(`${API_BASE}/items/${id}`);

          if (!response.ok) {
            throw new Error("Item not found");
          }

          const item = await response.json();

          currentItem = item;

          document.getElementById("itemTitle").textContent = item.title;
          document.getElementById("itemDescription").textContent =
            item.description;
          document.getElementById("itemLocation").textContent =
            "📍 " + item.location;

          const date = new Date(item.date);

          document.getElementById("itemDate").textContent =
            "📅 " + date.toLocaleDateString();

          document.getElementById("itemContact").textContent =
            "Reported by: " + item.contact;

          const typeElement = document.getElementById("itemType");

          typeElement.textContent = item.type.toUpperCase();

          if (item.type === "Lost") {
            typeElement.className = "badge bg-danger";
          } else {
            typeElement.className = "badge bg-success";
          }

          const claimButton =
            document.getElementById("claimButton");

          claimButton.style.display = "inline-block";

          claimButton.onclick = function () {
            submitClaim(item);
          };

          // Show Edit button
          const editButton =
            document.getElementById("editButton");

          editButton.style.display = "inline-block";

          editButton.onclick = function () {
            openEditForm();
          };
          const deleteButton = document.getElementById("deleteButton");

          deleteButton.style.display = "inline-block";

          deleteButton.onclick = async function () {

            const confirmed = confirm(
              `Are you sure you want to delete "${item.title}"?`
            );

            if (!confirmed) {
              return;
            }

            try {

              const response = await fetch(
                `${API_BASE}/items/${item._id}`,
                {
                  method: "DELETE"
                }
              );

              const data = await response.json();

              if (!response.ok) {
                throw new Error(
                  data.message || "Delete failed"
                );
              }

              alert("Item deleted successfully!");

              window.location.href = "items.html";

            } catch (error) {

              console.error("Delete error:", error);

              alert("Failed to delete item: " + error.message);
            }
          };

        } catch (error) {

          console.error("Error loading item:", error);

          document.getElementById("itemTitle").textContent =
            "Failed to load item";
        }
      }

      async function submitClaim(item) {
  const user = JSON.parse(localStorage.getItem("user") || "null");

  if (!user) {
    alert("Please login first.");
    window.location.href = "login.html";
    return;
  }

  const reason = prompt(
    `Why do you believe "${item.title}" belongs to you?`
  );

  if (!reason || !reason.trim()) {
    alert("Please provide a reason for your claim.");
    return;
  }

  try {
    const response = await fetch(`${API_BASE}/claims`, {
      method: "POST",
      headers: {
        ...authHeaders(true)
      },
      body: JSON.stringify({
        item: item._id,
        claimantName: user.name,
        claimantEmail: user.email,
        reason: reason.trim()
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.message || "Failed to submit claim");
    }

    alert("Claim submitted successfully!");

  } catch (error) {
    console.error("Claim error:", error);
    alert("Failed to submit claim: " + error.message);
  }
}

      function openEditForm() {

        document.getElementById("editForm").style.display = "block";

        document.getElementById("editTitle").value =
          currentItem.title;

        document.getElementById("editDescription").value =
          currentItem.description;

        document.getElementById("editLocation").value =
          currentItem.location;

        document.getElementById("editContact").value =
          currentItem.contact;

        window.scrollTo({
          top: document.body.scrollHeight,
          behavior: "smooth"
        });
      }


      document.getElementById("cancelEdit").onclick = function () {

        document.getElementById("editForm").style.display =
          "none";

      };


      document.getElementById("updateItemForm").onsubmit =
        async function (event) {

          event.preventDefault();

          const updatedData = {

            title: document.getElementById("editTitle").value,

            description:
              document.getElementById("editDescription").value,

            location:
              document.getElementById("editLocation").value,

            contact:
              document.getElementById("editContact").value

          };

          try {

            const response = await fetch(
              `${API_BASE}/items/${currentItem._id}`,
              {
                method: "PUT",

                headers: authHeaders(true),

                body: JSON.stringify(updatedData)
              }
            );

            const data = await response.json();

            if (!response.ok) {
              throw new Error(
                data.message || "Update failed"
              );
            }

            alert("Item updated successfully!");

            // Reload the updated information
            currentItem = data;

            document.getElementById("itemTitle").textContent =
              data.title;

            document.getElementById("itemDescription").textContent =
              data.description;

            document.getElementById("itemLocation").textContent =
              "📍 " + data.location;

            document.getElementById("itemContact").textContent =
              "Reported by: " + data.contact;

            document.getElementById("editForm").style.display =
              "none";

          } catch (error) {

            console.error("Update error:", error);

            alert("Failed to update item: " + error.message);

          }
        };


      document.addEventListener(
        "DOMContentLoaded",
        loadItemDetails
      );

    </script>

</body>

</html>
