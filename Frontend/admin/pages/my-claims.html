<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Claims</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <!-- Main Content -->
  <div class="container py-5">
    <a href="deshboard.html">← Dashboard</a>
    <h2 class="mt-3">My Claims</h2>

    <!-- Claims Table -->
    <div class="table-card mt-4">
      <table class="table">
        <thead>
          <tr>
            <th>Item</th>
            <th>Date</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="claimsTableBody">
  <tr>
    <td colspan="3" class="text-center">
      Loading claims...
    </td>
  </tr>
</tbody>
      </table>
    </div>
  </div>
<script src="../js/main.js"></script>

<script>
async function loadMyClaims() {
  const user = JSON.parse(localStorage.getItem("user") || "null");

  if (!user) {
    alert("Please login first.");
    window.location.href = "login.html";
    return;
  }

  try {
    const response = await fetch(`${API_BASE}/claims/mine`, { headers: authHeaders() });

    if (!response.ok) {
      throw new Error("Failed to load claims");
    }

    const claims = await response.json();

    const myClaims = claims.filter(
      claim => claim.claimantEmail === user.email
    );

    const tbody = document.getElementById("claimsTableBody");

    tbody.innerHTML = "";

    if (myClaims.length === 0) {
      tbody.innerHTML = `
        <tr>
          <td colspan="3" class="text-center">
            You have not submitted any claims yet.
          </td>
        </tr>
      `;
      return;
    }

    myClaims.forEach(claim => {
      const date = new Date(claim.createdAt);

      let badgeClass = "bg-warning";
      let statusText = "Under Review";

      if (claim.status === "Approved") {
        badgeClass = "bg-success";
        statusText = "Approved";
      }

      if (claim.status === "Rejected") {
        badgeClass = "bg-danger";
        statusText = "Rejected";
      }

      tbody.innerHTML += `
        <tr>
          <td>${claim.item?.title || "Unknown Item"}</td>
          <td>${date.toLocaleDateString()}</td>
          <td>
            <span class="badge ${badgeClass}">
              ${statusText}
            </span>
          </td>
        </tr>
      `;
    });

  } catch (error) {
    console.error("Error loading claims:", error);

    document.getElementById("claimsTableBody").innerHTML = `
      <tr>
        <td colspan="3" class="text-center text-danger">
          Failed to load claims.
        </td>
      </tr>
    `;
  }
}

document.addEventListener("DOMContentLoaded", loadMyClaims);
</script>
  
</body>
</html>
