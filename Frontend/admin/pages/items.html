<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lost & Found Items</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="../css/style.css">
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="../index.html">🎓 CampusFind</a>
      <a class="btn btn-light" href="deshboard.html">Dashboard</a>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container py-5">

    <h2>Lost & Found Items</h2>

    <!-- Search & Filter -->
    <div class="row g-2 my-4">

      <div class="col-md-7">
        <input
          id="searchInput"
          class="form-control"
          placeholder="Search..."
          onkeyup="searchItems()"
        >
      </div>

      <div class="col-md-3">
        <select
          id="categoryInput"
          class="form-select"
          onchange="searchItems()"
        >
          <option value="all">All Categories</option>
          <option value="electronics">Electronics</option>
          <option value="documents">Documents</option>
          <option value="books">Books</option>
          <option value="accessories">Accessories</option>
        </select>
      </div>

    </div>

    <!-- Item Cards -->
    <div class="row g-4" id="itemsContainer">
      <!-- Items will be loaded from MongoDB here -->
    </div>

  </div>

  <!-- JavaScript -->
  <script src="../js/main.js"></script>

</body>
</html>
