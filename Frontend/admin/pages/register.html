<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="../index.html">🎓 CampusFind</a>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container py-5">
    <div class="form-card">
      <h2>Create Account</h2>

      <!-- Registration Form -->
      <form onsubmit="studentRegister(event, this)">

        <label>Full Name</label>
        <input class="form-control mb-3" required>

        <!-- Student ID -->
        <label>Student ID</label>
        <input class="form-control mb-3" required>

        <!-- Email -->
        <label>Email</label>
        <input class="form-control mb-3" type="email" required>

        <!-- Password -->
        <label>Password</label>
        <input class="form-control mb-3" type="password" required>

        <!-- Confirm Password -->
        <label>Confirm Password</label>
        <input class="form-control mb-3" type="password" required>

        <!-- Submit Button -->
        <button class="btn btn-primary w-100">Register</button>
      </form>

      <!-- Login Link -->
      <p class="mt-3">
        Already registered? <a href="login.html">Login</a>
      </p>
    </div>
  </div>

  <!-- JavaScript -->
  <script src="../js/main.js"></script>
</body>
</html>
