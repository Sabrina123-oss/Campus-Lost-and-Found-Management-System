<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Report Lost Item</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="deshboard.html">🎓 CampusFind</a>
    </div>
  </nav>

  <!-- Main Container -->
  <div class="container">
    <div class="form-card">
      <h2>🔴 Report Lost Item</h2>
      <p class="text-muted">Provide details so others can identify your item.</p>

      <!-- Lost Item Form -->
      <form onsubmit="submitLostItem(event, this)">
        <!-- Item Name -->
        <label>Item Name</label>
<input class="form-control mb-3" id="title" required>

        <!-- Category -->
        <label>Category</label>
<select class="form-select mb-3" id="category" required>
  <option>Electronics</option>
  <option>Documents</option>
  <option>Books</option>
  <option>Accessories</option>
  <option>Others</option>
</select>

        <!-- Description -->
        <label>Description</label>
<textarea class="form-control mb-3" id="description" rows="4" required></textarea>
        
<!-- Last Seen Location -->
       <label>Last Seen Location</label>
<input class="form-control mb-3" id="location" required> 
        <!-- Date Lost -->
<label>Date Lost</label>
<input type="date" class="form-control mb-3" id="date" required>
<!-- Contact -->
<label>Contact Email</label>
<input type="email" class="form-control mb-3" id="contact" placeholder="student@example.com" required>


        <!-- Upload Image -->
        <label>Upload Image</label>
        <input type="file" class="form-control mb-3" accept="image/*">

        <!-- Submit Button -->
        <button class="btn btn-primary w-100">Submit Lost Report</button>
      </form>
    </div>
  </div>

  <!-- JavaScript -->
  <script src="../js/main.js"></script>
</body>
</html>
