<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Manage Posts</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- ================================= -->
    <!-- MAIN CONTENT -->
    <!-- ================================= -->

    <div class="container py-5">

        <!-- Dashboard Link -->
        <a
            href="deshboard.html"
            class="text-decoration-none">

            ← Admin Dashboard

        </a>

        <h2 class="mt-3">
            📋 Manage Posts
        </h2>

        <p class="text-muted">
            Manage lost and found items submitted by students.
        </p>


        <!-- ================================= -->
        <!-- POSTS TABLE -->
        <!-- ================================= -->

        <div class="table-card mt-4">

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead>

                        <tr>

                            <th>Item</th>

                            <th>Type</th>

                            <th>Category</th>

                            <th>Location</th>

                            <th>Status</th>

                            <th>Action</th>

                        </tr>

                    </thead>

                    <tbody id="postsContainer">

                        <tr>

                            <td
                                colspan="6"
                                class="text-center">

                                Loading posts...

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>


        <!-- ================================= -->
        <!-- MESSAGE -->
        <!-- ================================= -->

        <div
            id="postsMessage"
            class="mt-3 text-muted">
        </div>

    </div>


    <!-- ================================= -->
    <!-- EDIT POST MODAL -->
    <!-- ================================= -->

    <div
        class="modal fade"
        id="editPostModal"
        tabindex="-1"
        aria-labelledby="editPostModalLabel"
        aria-hidden="true">

        <div class="modal-dialog modal-lg">

            <div class="modal-content">

                <div class="modal-header">

                    <h5
                        class="modal-title"
                        id="editPostModalLabel">

                        Edit Post

                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Close">
                    </button>

                </div>


                <!-- EDIT FORM -->

                <form id="editPostForm">

                    <div class="modal-body">

                        <!-- Hidden ID -->

                        <input
                            type="hidden"
                            id="editItemId">


                        <!-- Title -->

                        <div class="mb-3">

                            <label
                                for="editTitle"
                                class="form-label">

                                Item Title

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="editTitle"
                                required>

                        </div>


                        <!-- Description -->

                        <div class="mb-3">

                            <label
                                for="editDescription"
                                class="form-label">

                                Description

                            </label>

                            <textarea
                                class="form-control"
                                id="editDescription"
                                rows="3">
                            </textarea>

                        </div>


                        <!-- Type -->

                        <div class="mb-3">

                            <label
                                for="editType"
                                class="form-label">

                                Type

                            </label>

                            <select
                                class="form-select"
                                id="editType"
                                required>

                                <option value="Lost">
                                    Lost
                                </option>

                                <option value="Found">
                                    Found
                                </option>

                            </select>

                        </div>


                        <!-- Category -->

                        <div class="mb-3">

                            <label
                                for="editCategory"
                                class="form-label">

                                Category

                            </label>

                            <select
                                class="form-select"
                                id="editCategory">

                                <option value="">
                                    Select Category
                                </option>

                                <option value="Electronics">
                                    Electronics
                                </option>

                                <option value="Documents">
                                    Documents
                                </option>

                                <option value="Books">
                                    Books
                                </option>

                                <option value="Accessories">
                                    Accessories
                                </option>

                                <option value="Other">
                                    Other
                                </option>

                            </select>

                        </div>


                        <!-- Location -->

                        <div class="mb-3">

                            <label
                                for="editLocation"
                                class="form-label">

                                Location

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="editLocation">

                        </div>


                        <!-- Date -->

                        <div class="mb-3">

                            <label
                                for="editDate"
                                class="form-label">

                                Date

                            </label>

                            <input
                                type="date"
                                class="form-control"
                                id="editDate">

                        </div>


                        <!-- Contact -->

                        <div class="mb-3">

                            <label
                                for="editContact"
                                class="form-label">

                                Contact

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="editContact">

                        </div>


                        <!-- Status -->

                        <div class="mb-3">

                            <label
                                for="editStatus"
                                class="form-label">

                                Status

                            </label>

                            <select
                                class="form-select"
                                id="editStatus">

                                <option value="Pending">
                                    Pending
                                </option>

                                <option value="Approved">
                                    Approved
                                </option>

                                <option value="Rejected">
                                    Rejected
                                </option>

                            </select>

                        </div>

                    </div>


                    <!-- MODAL FOOTER -->

                    <div class="modal-footer">

                        <button
                            type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal">

                            Cancel

                        </button>

                        <button
                            type="submit"
                            class="btn btn-primary"
                            id="saveEditButton">

                            Save Changes

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>


    <!-- ================================= -->
    <!-- JAVASCRIPT -->
    <!-- ================================= -->

    <script src="js/main.js"></script>

<script>

        // ==========================================
        // API URL
        // ==========================================

        const API_URL =
            "http://localhost:5000/api";


        // ==========================================
        // BOOTSTRAP MODAL
        // ==========================================

        let editModal;


        document.addEventListener(
            "DOMContentLoaded",
            function () {

                const modalElement =
                    document.getElementById(
                        "editPostModal"
                    );

                editModal =
                    new bootstrap.Modal(
                        modalElement
                    );

                loadPosts();

            }
        );


        // ==========================================
        // LOAD POSTS
        // ==========================================

        async function loadPosts() {

            const container =
                document.getElementById(
                    "postsContainer"
                );

            const message =
                document.getElementById(
                    "postsMessage"
                );


            container.innerHTML = `
                <tr>
                    <td colspan="6"
                        class="text-center">
                        Loading posts...
                    </td>
                </tr>
            `;


            try {

                console.log(
                    "Loading posts..."
                );


                const response =
                    await fetch(
                        API_URL + "/items/admin/all",
                        { headers: authHeaders() }
                    );


                if (!response.ok) {

                    throw new Error(
                        "Failed to load posts. Status: "
                        + response.status
                    );

                }


                const items =
                    await response.json();


                console.log(
                    "Items received:",
                    items
                );


                container.innerHTML = "";


                // ==================================
                // NO ITEMS
                // ==================================

                if (
                    !Array.isArray(items) ||
                    items.length === 0
                ) {

                    container.innerHTML = `
                        <tr>

                            <td
                                colspan="6"
                                class="text-center text-muted">

                                No posts found.

                            </td>

                        </tr>
                    `;

                    message.textContent =
                        "No posts available.";

                    return;

                }


                // ==================================
                // CREATE TABLE ROWS
                // ==================================

                items.forEach(
                    function (item) {

                        const row =
                            document.createElement(
                                "tr"
                            );


                        // TITLE

                        const title =
                            escapeHtml(
                                item.title ||
                                "Untitled"
                            );


                        // TYPE

                        const type =
                            escapeHtml(
                                item.type ||
                                "-"
                            );


                        // CATEGORY

                        const category =
                            escapeHtml(
                                item.category ||
                                "-"
                            );


                        // LOCATION

                        const location =
                            escapeHtml(
                                item.location ||
                                "-"
                            );


                        // STATUS

                        const status =
                            String(
                                item.status ||
                                "Pending"
                            );


                        const statusLower =
                            status.toLowerCase();


                        // ==================================
                        // STATUS BADGE
                        // ==================================

                        let statusBadge;


                        if (
                            statusLower ===
                            "approved"
                        ) {

                            statusBadge = `
                                <span
                                    class="badge bg-success">

                                    Approved

                                </span>
                            `;

                        }

                        else if (
                            statusLower ===
                            "rejected"
                        ) {

                            statusBadge = `
                                <span
                                    class="badge bg-danger">

                                    Rejected

                                </span>
                            `;

                        }

                        else {

                            statusBadge = `
                                <span
                                    class="badge bg-warning text-dark">

                                    Pending

                                </span>
                            `;

                        }


                        // ==================================
                        // ACTION BUTTONS
                        // ==================================

                        let actionButtons = "";


                        // APPROVE BUTTON

                        if (
                            statusLower !==
                            "approved"
                        ) {

                            actionButtons += `
                                <button
                                    class="btn btn-success btn-sm me-1 mb-1"
                                    onclick="approvePost('${item._id}')">

                                    Approve

                                </button>
                            `;

                        }


                        // EDIT BUTTON

                        actionButtons += `
                            <button
                                class="btn btn-primary btn-sm me-1 mb-1"
                                onclick="editPost('${item._id}')">

                                Edit

                            </button>
                        `;


                        // DELETE BUTTON

                        actionButtons += `
                            <button
                                class="btn btn-danger btn-sm mb-1"
                                onclick="deletePost('${item._id}')">

                                Delete

                            </button>
                        `;


                        // ==================================
                        // ROW
                        // ==================================

                        row.innerHTML = `

                            <td>
                                ${title}
                            </td>

                            <td>
                                ${type}
                            </td>

                            <td>
                                ${category}
                            </td>

                            <td>
                                ${location}
                            </td>

                            <td>
                                ${statusBadge}
                            </td>

                            <td>
                                ${actionButtons}
                            </td>

                        `;


                        container.appendChild(
                            row
                        );

                    }
                );


                message.textContent =
                    "Posts loaded successfully.";


            }

            catch (error) {

                console.error(
                    "Posts error:",
                    error
                );


                container.innerHTML = `

                    <tr>

                        <td
                            colspan="6"
                            class="text-center text-danger">

                            Unable to load posts.

                        </td>

                    </tr>

                `;


                message.textContent =
                    "Make sure the backend server is running.";

            }

        }


        // ==========================================
        // APPROVE POST
        // ==========================================

        async function approvePost(itemId) {

            if (!itemId) {

                alert(
                    "Item ID is missing."
                );

                return;

            }


            const confirmed =
                confirm(
                    "Are you sure you want to approve this post?"
                );


            if (!confirmed) {
                return;
            }


            try {

                console.log(
                    "Approving item:",
                    itemId
                );


                const response =
                    await fetch(
                        API_URL +
                        "/items/" +
                        itemId,
                        {
                            method: "PUT",

                            headers: authHeaders(true),

                            body:
                                JSON.stringify({
                                    status:
                                        "Approved"
                                })
                        }
                    );


                if (!response.ok) {

                    const errorText =
                        await response.text();

                    console.error(
                        "Approve error:",
                        errorText
                    );

                    throw new Error(
                        "Failed to approve post."
                    );

                }


                alert(
                    "Post approved successfully."
                );


                await loadPosts();

            }

            catch (error) {

                console.error(
                    "Approve error:",
                    error
                );


                alert(
                    "Could not approve the post."
                );

            }

        }


        // ==========================================
        // EDIT POST
        // ==========================================

        async function editPost(itemId) {

            if (!itemId) {

                alert(
                    "Item ID is missing."
                );

                return;

            }


            try {

                console.log(
                    "Editing item:",
                    itemId
                );


                // GET SINGLE ITEM

                const response =
                    await fetch(
                        API_URL +
                        "/items/admin/" +
                        itemId,
                        { headers: authHeaders() }
                    );


                if (!response.ok) {

                    const errorText =
                        await response.text();

                    console.error(
                        "Get item error:",
                        errorText
                    );

                    throw new Error(
                        "Failed to load item."
                    );

                }


                const item =
                    await response.json();


                console.log(
                    "Item loaded for editing:",
                    item
                );


                // ==================================
                // FILL FORM
                // ==================================

                document.getElementById(
                    "editItemId"
                ).value =
                    item._id || "";


                document.getElementById(
                    "editTitle"
                ).value =
                    item.title || "";


                document.getElementById(
                    "editDescription"
                ).value =
                    item.description || "";


                document.getElementById(
                    "editType"
                ).value =
                    item.type || "Lost";


                document.getElementById(
                    "editCategory"
                ).value =
                    item.category || "";


                document.getElementById(
                    "editLocation"
                ).value =
                    item.location || "";


                document.getElementById(
                    "editContact"
                ).value =
                    item.contact || "";


                document.getElementById(
                    "editStatus"
                ).value =
                    item.status || "Pending";


                // ==================================
                // DATE
                // ==================================

                if (item.date) {

                    const date =
                        new Date(item.date);

                    const formattedDate =
                        date.toISOString()
                            .split("T")[0];

                    document.getElementById(
                        "editDate"
                    ).value =
                        formattedDate;

                }

                else {

                    document.getElementById(
                        "editDate"
                    ).value = "";

                }


                // ==================================
                // SHOW MODAL
                // ==================================

                editModal.show();

            }

            catch (error) {

                console.error(
                    "Edit error:",
                    error
                );


                alert(
                    "Could not load the post."
                );

            }

        }


        // ==========================================
        // UPDATE POST
        // ==========================================

        document.getElementById(
            "editPostForm"
        ).addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const itemId =
                    document.getElementById(
                        "editItemId"
                    ).value;


                if (!itemId) {

                    alert(
                        "Item ID is missing."
                    );

                    return;

                }


                const saveButton =
                    document.getElementById(
                        "saveEditButton"
                    );


                // Disable button

                saveButton.disabled = true;

                saveButton.textContent =
                    "Saving...";


                try {

                    console.log(
                        "Updating item:",
                        itemId
                    );


                    // ==================================
                    // GET FORM VALUES
                    // ==================================

                    const updatedItem = {

                        title:
                            document.getElementById(
                                "editTitle"
                            ).value.trim(),

                        description:
                            document.getElementById(
                                "editDescription"
                            ).value.trim(),

                        type:
                            document.getElementById(
                                "editType"
                            ).value,

                        category:
                            document.getElementById(
                                "editCategory"
                            ).value,

                        location:
                            document.getElementById(
                                "editLocation"
                            ).value.trim(),

                        date:
                            document.getElementById(
                                "editDate"
                            ).value,

                        contact:
                            document.getElementById(
                                "editContact"
                            ).value.trim(),

                        status:
                            document.getElementById(
                                "editStatus"
                            ).value

                    };


                    console.log(
                        "Sending update:",
                        updatedItem
                    );


                    // ==================================
                    // PUT REQUEST
                    // ==================================

                    const response =
                        await fetch(
                            API_URL +
                            "/items/" +
                            itemId,
                            {

                                method: "PUT",

                                headers: authHeaders(true),

                                body:
                                    JSON.stringify(
                                        updatedItem
                                    )

                            }
                        );


                    // ==================================
                    // CHECK RESPONSE
                    // ==================================

                    if (!response.ok) {

                        const errorText =
                            await response.text();

                        console.error(
                            "Update response:",
                            errorText
                        );

                        throw new Error(
                            "Update failed. Status: "
                            + response.status
                        );

                    }


                    const updated =
                        await response.json();


                    console.log(
                        "Updated item:",
                        updated
                    );


                    // ==================================
                    // SUCCESS
                    // ==================================

                    alert(
                        "Post updated successfully!"
                    );


                    // Close modal

                    editModal.hide();


                    // Reload table

                    await loadPosts();

                }

                catch (error) {

                    console.error(
                        "Update error:",
                        error
                    );


                    alert(
                        "Could not update the post. Check the backend console."
                    );

                }

                finally {

                    saveButton.disabled =
                        false;

                    saveButton.textContent =
                        "Save Changes";

                }

            }
        );


        // ==========================================
        // DELETE POST
        // ==========================================

        async function deletePost(itemId) {

            if (!itemId) {

                alert(
                    "Item ID is missing."
                );

                return;

            }


            const confirmed =
                confirm(
                    "Are you sure you want to delete this post?"
                );


            if (!confirmed) {
                return;
            }


            try {

                console.log(
                    "Deleting item:",
                    itemId
                );


                const response =
                    await fetch(
                        API_URL +
                        "/items/" +
                        itemId,
                        {
                            method: "DELETE",
                            headers: authHeaders()
                        }
                    );


                if (!response.ok) {

                    const errorText =
                        await response.text();

                    console.error(
                        "Delete response:",
                        errorText
                    );

                    throw new Error(
                        "Failed to delete post."
                    );

                }


                alert(
                    "Post deleted successfully."
                );


                await loadPosts();

            }

            catch (error) {

                console.error(
                    "Delete error:",
                    error
                );


                alert(
                    "Could not delete the post."
                );

            }

        }


        // ==========================================
        // ESCAPE HTML
        // ==========================================

        function escapeHtml(value) {

            const div =
                document.createElement(
                    "div"
                );


            div.textContent =
                value;


            return div.innerHTML;

        }

    </script>


    <!-- ================================= -->
    <!-- BOOTSTRAP JS -->
    <!-- ================================= -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
