<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1">

    <title>Manage Users</title>


    <!-- Bootstrap CSS -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Custom CSS -->

    <link
        rel="stylesheet"
        href="css/style.css">

</head>


<body>


    <!-- ================================= -->
    <!-- MAIN CONTENT -->
    <!-- ================================= -->

    <div class="container py-5">


        <!-- Dashboard -->

        <a
            href="deshboard.html"
            class="text-decoration-none">

            ← Admin Dashboard

        </a>


        <h2 class="mt-3">

            👥 Manage Users

        </h2>


        <p class="text-muted">

            Manage registered students and administrators.

        </p>


        <!-- ================================= -->
        <!-- SEARCH -->
        <!-- ================================= -->

        <div class="row mt-4 mb-3">

            <div class="col-md-6">

                <input
                    type="text"
                    id="searchUsers"
                    class="form-control"
                    placeholder="Search by name or email...">

            </div>

        </div>


        <!-- ================================= -->
        <!-- USERS TABLE -->
        <!-- ================================= -->

        <div class="table-card">

            <div class="table-responsive">

                <table
                    class="table table-hover align-middle">

                    <thead>

                        <tr>

                            <th>Name</th>

                            <th>Email</th>

                            <th>Role</th>

                            <th>Status</th>

                            <th>Action</th>

                        </tr>

                    </thead>


                    <tbody id="usersContainer">

                        <tr>

                            <td
                                colspan="5"
                                class="text-center">

                                Loading users...

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>


        <!-- ================================= -->
        <!-- MESSAGE -->
        <!-- ================================= -->

        <div
            id="usersMessage"
            class="mt-3 text-muted">
        </div>


    </div>



    <!-- ================================= -->
    <!-- EDIT USER MODAL -->
    <!-- ================================= -->

    <div
        class="modal fade"
        id="editUserModal"
        tabindex="-1"
        aria-hidden="true">


        <div class="modal-dialog">


            <div class="modal-content">


                <div class="modal-header">

                    <h5 class="modal-title">

                        Edit User

                    </h5>


                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                    </button>

                </div>


                <!-- FORM -->

                <form id="editUserForm">


                    <div class="modal-body">


                        <!-- User ID -->

                        <input
                            type="hidden"
                            id="editUserId">


                        <!-- Name -->

                        <div class="mb-3">

                            <label
                                for="editUserName"
                                class="form-label">

                                Name

                            </label>


                            <input
                                type="text"
                                id="editUserName"
                                class="form-control"
                                required>

                        </div>


                        <!-- Email -->

                        <div class="mb-3">

                            <label
                                for="editUserEmail"
                                class="form-label">

                                Email

                            </label>


                            <input
                                type="email"
                                id="editUserEmail"
                                class="form-control"
                                required>

                        </div>


                        <!-- Role -->

                        <div class="mb-3">

                            <label
                                for="editUserRole"
                                class="form-label">

                                Role

                            </label>


                            <select
                                id="editUserRole"
                                class="form-select">

                                <option value="student">
                                    Student
                                </option>

                                <option value="admin">
                                    Admin
                                </option>

                            </select>

                        </div>


                        <!-- Status -->

                        <div class="mb-3">

                            <label
                                for="editUserStatus"
                                class="form-label">

                                Status

                            </label>


                            <select
                                id="editUserStatus"
                                class="form-select">

                                <option value="active">
                                    Active
                                </option>

                                <option value="inactive">
                                    Inactive
                                </option>

                            </select>

                        </div>


                    </div>


                    <!-- FOOTER -->

                    <div class="modal-footer">


                        <button
                            type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal">

                            Cancel

                        </button>


                        <button
                            type="submit"
                            class="btn btn-primary"
                            id="saveUserButton">

                            Save Changes

                        </button>


                    </div>


                </form>

            </div>

        </div>

    </div>



    <!-- ================================= -->
    <!-- BOOTSTRAP JS -->
    <!-- ================================= -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>



    <!-- ================================= -->
    <!-- PAGE JAVASCRIPT -->
    <!-- ================================= -->

    <script src="js/main.js"></script>

<script>

        // ==========================================
        // API
        // ==========================================

        const API_URL =
            "http://localhost:5000/api";


        // ==========================================
        // MODAL
        // ==========================================

        let editUserModal;


        document.addEventListener(
            "DOMContentLoaded",
            function () {

                const modalElement =
                    document.getElementById(
                        "editUserModal"
                    );


                editUserModal =
                    new bootstrap.Modal(
                        modalElement
                    );


                loadUsers();


            }
        );


        // ==========================================
        // LOAD USERS
        // ==========================================

        async function loadUsers() {


            const container =
                document.getElementById(
                    "usersContainer"
                );


            const message =
                document.getElementById(
                    "usersMessage"
                );


            container.innerHTML = `

                <tr>

                    <td
                        colspan="5"
                        class="text-center">

                        Loading users...

                    </td>

                </tr>

            `;


            try {


                console.log(
                    "Loading users..."
                );


                const response =
                    await fetch(
                        API_URL + "/users"
                    );


                if (!response.ok) {

                    const errorText =
                        await response.text();

                    console.error(
                        "Users API error:",
                        errorText
                    );

                    throw new Error(
                        "Failed to load users. Status: "
                        + response.status
                    );

                }


                const users =
                    await response.json();


                console.log(
                    "Users received:",
                    users
                );


                container.innerHTML = "";


                // ==================================
                // NO USERS
                // ==================================

                if (
                    !Array.isArray(users) ||
                    users.length === 0
                ) {


                    container.innerHTML = `

                        <tr>

                            <td
                                colspan="5"
                                class="text-center text-muted">

                                No users found.

                            </td>

                        </tr>

                    `;


                    message.textContent =
                        "No registered users.";


                    return;

                }


                // ==================================
                // CREATE ROWS
                // ==================================

                users.forEach(
                    function (user) {


                        const row =
                            document.createElement(
                                "tr"
                            );


                        const name =
                            escapeHtml(
                                user.name ||
                                "Unknown"
                            );


                        const email =
                            escapeHtml(
                                user.email ||
                                "-"
                            );


                        const role =
                            String(
                                user.role ||
                                "student"
                            );


                        const status =
                            String(
                                user.status ||
                                "active"
                            );


                        // ROLE BADGE

                        let roleBadge;


                        if (
                            role.toLowerCase() ===
                            "admin"
                        ) {

                            roleBadge = `

                                <span
                                    class="badge bg-danger">

                                    Admin

                                </span>

                            `;

                        }

                        else {

                            roleBadge = `

                                <span
                                    class="badge bg-primary">

                                    Student

                                </span>

                            `;

                        }


                        // STATUS BADGE

                        let statusBadge;


                        if (
                            status.toLowerCase() ===
                            "active"
                        ) {

                            statusBadge = `

                                <span
                                    class="badge bg-success">

                                    Active

                                </span>

                            `;

                        }

                        else {

                            statusBadge = `

                                <span
                                    class="badge bg-secondary">

                                    Inactive

                                </span>

                            `;

                        }


                        // ==================================
                        // ACTIONS
                        // ==================================

                        const actions = `

                            <button
                                class="btn btn-primary btn-sm me-1 mb-1"
                                onclick="editUser('${user._id}')">

                                Edit

                            </button>


                            <button
                                class="btn btn-danger btn-sm mb-1"
                                onclick="deleteUser('${user._id}')">

                                Delete

                            </button>

                        `;


                        // ==================================
                        // ROW
                        // ==================================

                        row.innerHTML = `

                            <td>
                                ${name}
                            </td>


                            <td>
                                ${email}
                            </td>


                            <td>
                                ${roleBadge}
                            </td>


                            <td>
                                ${statusBadge}
                            </td>


                            <td>
                                ${actions}
                            </td>

                        `;


                        container.appendChild(
                            row
                        );

                    }
                );


                message.textContent =
                    "Users loaded successfully.";


                applyUserSearch();


            }


            catch (error) {


                console.error(
                    "Load users error:",
                    error
                );


                container.innerHTML = `

                    <tr>

                        <td
                            colspan="5"
                            class="text-center text-danger">

                            Unable to load users.

                        </td>

                    </tr>

                `;


                message.textContent =
                    "Make sure the backend server is running.";

            }

        }



        // ==========================================
        // EDIT USER
        // ==========================================

        async function editUser(userId) {


            if (!userId) {

                alert(
                    "User ID is missing."
                );

                return;

            }


            try {


                console.log(
                    "Editing user:",
                    userId
                );


                const response =
                    await fetch(
                        API_URL +
                        "/users/" +
                        userId
                    );


                if (!response.ok) {

                    throw new Error(
                        "Failed to load user."
                    );

                }


                const user =
                    await response.json();


                console.log(
                    "User loaded:",
                    user
                );


                // Fill form

                document.getElementById(
                    "editUserId"
                ).value =
                    user._id || "";


                document.getElementById(
                    "editUserName"
                ).value =
                    user.name || "";


                document.getElementById(
                    "editUserEmail"
                ).value =
                    user.email || "";


                document.getElementById(
                    "editUserRole"
                ).value =
                    user.role || "student";


                document.getElementById(
                    "editUserStatus"
                ).value =
                    user.status || "active";


                editUserModal.show();


            }


            catch (error) {


                console.error(
                    "Edit user error:",
                    error
                );


                alert(
                    "Could not load the user."
                );

            }

        }



        // ==========================================
        // UPDATE USER
        // ==========================================

        document.getElementById(
            "editUserForm"
        ).addEventListener(
            "submit",
            async function (event) {


                event.preventDefault();


                const userId =
                    document.getElementById(
                        "editUserId"
                    ).value;


                if (!userId) {

                    alert(
                        "User ID is missing."
                    );

                    return;

                }


                const button =
                    document.getElementById(
                        "saveUserButton"
                    );


                button.disabled = true;

                button.textContent =
                    "Saving...";


                try {


                    const updatedUser = {

                        name:
                            document.getElementById(
                                "editUserName"
                            ).value.trim(),

                        email:
                            document.getElementById(
                                "editUserEmail"
                            ).value.trim(),

                        role:
                            document.getElementById(
                                "editUserRole"
                            ).value,

                        status:
                            document.getElementById(
                                "editUserStatus"
                            ).value

                    };


                    console.log(
                        "Updating user:",
                        userId,
                        updatedUser
                    );


                    const response =
                        await fetch(
                            API_URL +
                            "/users/" +
                            userId,
                            {

                                method: "PUT",
                                headers: authHeaders(true),

                                body:
                                    JSON.stringify(
                                        updatedUser
                                    )

                            }
                        );


                    if (!response.ok) {

                        const errorText =
                            await response.text();

                        console.error(
                            "Update user error:",
                            errorText
                        );

                        throw new Error(
                            "Failed to update user."
                        );

                    }


                    const result =
                        await response.json();


                    console.log(
                        "User updated:",
                        result
                    );


                    alert(
                        "User updated successfully!"
                    );


                    editUserModal.hide();


                    await loadUsers();


                }


                catch (error) {


                    console.error(
                        "Update user error:",
                        error
                    );


                    alert(
                        "Could not update the user."
                    );

                }


                finally {

                    button.disabled = false;

                    button.textContent =
                        "Save Changes";

                }

            }
        );



        // ==========================================
        // DELETE USER
        // ==========================================

        async function deleteUser(userId) {


            if (!userId) {

                alert(
                    "User ID is missing."
                );

                return;

            }


            const confirmed =
                confirm(
                    "Are you sure you want to delete this user?"
                );


            if (!confirmed) {

                return;

            }


            try {


                console.log(
                    "Deleting user:",
                    userId
                );


                const response =
                    await fetch(
                        API_URL +
                        "/users/" +
                        userId,
                        {

                            method: "DELETE",
                            headers: authHeaders()

                        }
                    );


                if (!response.ok) {

                    const errorText =
                        await response.text();

                    console.error(
                        "Delete user error:",
                        errorText
                    );

                    throw new Error(
                        "Failed to delete user."
                    );

                }


                alert(
                    "User deleted successfully!"
                );


                await loadUsers();


            }


            catch (error) {


                console.error(
                    "Delete user error:",
                    error
                );


                alert(
                    "Could not delete the user."
                );

            }

        }



        // ==========================================
        // SEARCH USERS
        // ==========================================

        document.getElementById(
            "searchUsers"
        ).addEventListener(
            "input",
            function () {

                applyUserSearch();

            }
        );


        function applyUserSearch() {


            const search =
                document.getElementById(
                    "searchUsers"
                ).value
                .toLowerCase()
                .trim();


            const rows =
                document.querySelectorAll(
                    "#usersContainer tr"
                );


            rows.forEach(
                function (row) {


                    const text =
                        row.textContent
                        .toLowerCase();


                    if (
                        !search ||
                        text.includes(search)
                    ) {

                        row.style.display =
                            "";

                    }

                    else {

                        row.style.display =
                            "none";

                    }

                }
            );

        }



        // ==========================================
        // ESCAPE HTML
        // ==========================================

        function escapeHtml(value) {


            const div =
                document.createElement(
                    "div"
                );


            div.textContent =
                value;


            return div.innerHTML;

        }

    </script>

</body>

</html>
