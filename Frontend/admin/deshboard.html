<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Dashboard</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div class="row g-0">
    <!-- Sidebar -->
    <aside class="col-md-3 sidebar">
      <h4>⚙️ Admin</h4>
      <hr>
      <a href="deshboard.html">📊 Dashboard</a>
      <a href="users.html">👥 Users</a>
      <a href="post.html">📋 Posts</a>
      <a href="claims.html">🛡️ Claims</a>
      <a href="notifications.html">🔔 Notifications</a>
      <a href="reports.html">📈 Reports</a>
      <a href="#" onclick="adminLogout()">↩ Logout</a>
    </aside>

    <!-- Main Dashboard -->
    <main class="col-md-9 dashboard-main">
      <h2>Admin Dashboard</h2>
      <p class="text-muted">CampusFind management overview</p>

      <!-- Stats Section -->
      <div class="row g-3 my-3">
        <div class="col-md-3">
          <div class="stat-card">
            <h2 id="userCount">0</h2>
            <p>Users</p>
          </div>
        </div>
        <div class="col-md-3">
          <div class="stat-card">
            <h2 id="lostCount">0</h2>
            <p>Lost</p>
          </div>
        </div>
        <div class="col-md-3">
          <div class="stat-card">
            <h2 id="foundCount">0</h2>
            <p>Found</p>
          </div>
        </div>
        <div class="col-md-3">
          <div class="stat-card">
            <h2 id="claimCount">0</h2>
            <p>Claims</p>
          </div>
        </div>
      </div>

      <!-- Pending Actions -->
      <div class="panel mt-4">
        <h4>Pending Actions</h4>
        <p>
          <span id="pendingPostsCount">0</span> posts waiting for approval and
          <span id="pendingClaimsCount">0</span> claims waiting for verification.
        </p>
        <div class="d-flex gap-2 flex-wrap">
          <a class="btn btn-primary" href="post.html">Review Posts</a>
          <a class="btn btn-warning" href="claims.html">Review Claims</a>
        </div>
      </div>
    </main>
  </div>
  <script src="js/main.js"></script>

  <script>
    protectAdminPage();
  </script>
</body>

</html>
