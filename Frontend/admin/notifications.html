<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Notifications</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Main Content -->
  <div class="container py-5">
    <a href="deshboard.html">← Admin Dashboard</a>

    <div class="form-card">
      <h2>🔔 Send Notification</h2>

      <!-- Notification Form -->
      <form onsubmit="submitDemo(this,'Notification sent!')">
        <!-- Recipient -->
        <label>Recipient</label>
        <input class="form-control mb-3" placeholder="Student email or All Users" required>

        <!-- Message -->
        <label>Message</label>
        <textarea class="form-control mb-3" rows="5" required></textarea>

        <!-- Submit Button -->
        <button class="btn btn-primary">Send Notification</button>
      </form>
    </div>
  </div>

  <!-- JavaScript -->
  <script src="js/main.js"></script>
</body>
</html>
